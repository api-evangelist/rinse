name: Rinse
description: 'Rinse is a laundry and dry cleaning delivery service that picks up customers''
  clothes from home, professionally cleans them, and returns them on a recurring or one-off
  schedule. It runs a wash & fold and dry cleaning model in which uniformed valets handle
  evening pickup and delivery (typically 7pm-10pm) across major U.S. metros including the
  San Francisco Bay Area, New York, Los Angeles, Chicago, Washington D.C., Boston, Seattle,
  and Austin, plus Toronto. Rinse emphasizes convenience, garment care, sustainability, and
  employing its valets as W-2 employees with benefits. The company is backed by Partech and is
  tracked in the API Evangelist network. As of this enrichment pass Rinse publishes a consumer
  web and mobile product but no public developer API, developer portal, or API documentation.'
